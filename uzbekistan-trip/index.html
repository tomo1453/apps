<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E8C83">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ウズベキスタン">
<meta name="format-detection" content="telephone=no">
<title>ウズベキスタン旅のしおり</title>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<style>
:root {
  --teal: #0E8C83;
  --teal-dark: #0A6B64;
  --teal-light: #E3F6F3;
  --teal-mid: #9FDCD4;
  --gold: #F2B632;
  --gold-dark: #B9820C;
  --gold-light: #FFF5D9;
  --red: #E0473E;
  --red-light: #FDECEA;
  --ink: #1D2B2A;
  --sub: #5D706E;
  --line: #D8E9E6;
  --bg: #F3FAF8;
  --card: #FFFFFF;
  --radius: 18px;
  --tabh: 64px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
  font-size: 16px;
  line-height: 1.55;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; }

/* ===== ヘッダー ===== */
header.top {
  position: sticky; top: 0; z-index: 10;
  background: linear-gradient(135deg, var(--teal) 0%, #13A89C 60%, #19B5A6 100%);
  color: #fff;
  padding: calc(env(safe-area-inset-top) + 12px) 16px 14px;
  border-radius: 0 0 24px 24px;
  box-shadow: 0 6px 18px rgba(14,140,131,.25);
}
.top-title { font-size: 13px; opacity: .9; letter-spacing: .04em; display: flex; justify-content: space-between; align-items: center; }
.top-title .tz-btn { background: rgba(255,255,255,.18); border: 0; border-radius: 999px; padding: 2px 10px; font-size: 12px; color: #fff; }
.countdown { font-size: 26px; font-weight: 800; margin-top: 2px; letter-spacing: .02em; }
.countdown b { color: var(--gold); font-size: 38px; margin: 0 2px; text-shadow: 0 2px 0 rgba(0,0,0,.12); }
.top-sub { font-size: 13px; opacity: .95; margin-top: 2px; }
.tz-note {
  display: none; margin-top: 10px; background: rgba(255,255,255,.16); border-radius: 12px;
  padding: 8px 12px; font-size: 13px;
}
.tz-note.show { display: block; }

/* ===== メイン ===== */
main { padding: 14px 14px calc(var(--tabh) + env(safe-area-inset-bottom) + 24px); max-width: 640px; margin: 0 auto; }
section.view { display: none; }
section.view.active { display: block; }
h2.sec { font-size: 15px; color: var(--teal-dark); margin: 18px 4px 8px; display: flex; align-items: center; gap: 6px; }
h2.sec:first-child { margin-top: 4px; }

.card {
  background: var(--card); border-radius: var(--radius); margin-bottom: 12px;
  box-shadow: 0 2px 0 var(--line), 0 4px 14px rgba(29,43,42,.05);
  border: 2px solid transparent; overflow: hidden;
}
.pill {
  display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px;
  background: var(--teal-light); color: var(--teal-dark); white-space: nowrap;
}
.pill.gold { background: var(--gold-light); color: var(--gold-dark); }
.pill.red { background: var(--red); color: #fff; }
.pill.gray { background: #ECEFEF; color: #6B7A78; }

/* 日程カード */
.day-head {
  display: flex; align-items: center; gap: 12px; padding: 12px 14px; width: 100%;
  background: none; border: 0; text-align: left; cursor: pointer;
}
.day-date {
  flex: 0 0 56px; height: 56px; border-radius: 14px; background: var(--teal-light); color: var(--teal-dark);
  display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1;
}
.day-date .md { font-size: 17px; font-weight: 800; }
.day-date .dow { font-size: 11px; font-weight: 700; }
.day-date.sat .dow { color: #2F6FD0; }
.day-date.sun .dow { color: var(--red); }
.day-main { flex: 1; min-width: 0; }
.day-title { font-weight: 800; font-size: 16px; }
.day-meta { font-size: 12px; color: var(--sub); display: flex; gap: 6px; flex-wrap: wrap; margin-top: 3px; align-items: center; }
.chev { flex: 0 0 auto; width: 26px; height: 26px; border-radius: 50%; background: var(--teal-light); color: var(--teal); display: grid; place-items: center; font-size: 13px; transition: transform .2s; }
.card.open .chev { transform: rotate(180deg); }
.day-body { display: none; padding: 0 14px 14px; }
.card.open .day-body { display: block; }

.card.today { border-color: var(--gold); box-shadow: 0 0 0 4px rgba(242,182,50,.25), 0 6px 18px rgba(242,182,50,.25); }
.card.today .day-date { background: var(--gold); color: #fff; }
.card.today .day-date .dow { color: #fff; }
.card.past { opacity: .62; }
.today-badge { background: var(--gold); color: #fff; }
.card.has-warn .day-date { box-shadow: inset 0 0 0 2px var(--red); }

.timeline { list-style: none; margin: 0; padding: 0; border-left: 3px dotted var(--teal-mid); margin-left: 6px; }
.timeline li { position: relative; padding: 4px 0 10px 16px; }
.timeline li::before {
  content: ""; position: absolute; left: -8px; top: 10px; width: 13px; height: 13px; border-radius: 50%;
  background: #fff; border: 3px solid var(--teal);
}
.timeline li.flight::before, .timeline li.train::before { border-color: var(--gold); background: var(--gold-light); }
.timeline li.warn::before { border-color: var(--red); background: var(--red); }
.tl-time { font-weight: 800; color: var(--teal-dark); font-size: 14px; margin-right: 6px; font-variant-numeric: tabular-nums; }
.tl-text { font-size: 15px; }
.tl-note { font-size: 12.5px; color: var(--sub); margin-top: 2px; }
.warn-box {
  background: var(--red-light); color: var(--red); border: 2px solid var(--red); border-radius: 12px;
  padding: 8px 10px; font-weight: 700; font-size: 14px; margin-top: 4px;
}
.warn-box::before { content: "⚠️ "; }
.stay-row {
  display: flex; align-items: center; gap: 8px; background: var(--gold-light); border-radius: 12px;
  padding: 8px 12px; margin-top: 6px; font-size: 14px;
}
.stay-row b { color: var(--gold-dark); }
.stay-row button { margin-left: auto; }

/* 移動 */
.move { padding: 14px; }
.move-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.move-name { font-weight: 800; font-size: 17px; }
.move-route { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; margin: 10px 0 4px; }
.move-pt .t { font-size: 24px; font-weight: 800; color: var(--teal-dark); font-variant-numeric: tabular-nums; line-height: 1.1; }
.move-pt .p { font-size: 13px; font-weight: 700; }
.move-pt .z { font-size: 11px; color: var(--sub); }
.move-pt.to { text-align: right; }
.move-arrow { color: var(--gold); font-size: 22px; font-weight: 800; }
.move-detail { font-size: 13px; color: var(--sub); margin-top: 6px; }
.move-detail div + div { margin-top: 2px; }
.move.cancelled { background: #F6F7F7; }
.move.cancelled .move-route { text-decoration: line-through; opacity: .5; }
.move.unbooked { border-color: var(--red); background: var(--red-light); }
.info-card { padding: 14px 16px; background: linear-gradient(135deg, var(--gold-light), #fff); border: 2px solid #F7DB93; }
.info-card ul { margin: 6px 0 0; padding-left: 1.2em; font-size: 14px; }
.info-card li + li { margin-top: 3px; }

/* 宿 */
.hotel { padding: 14px; }
.hotel-dates { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
.hotel-name { font-size: 18px; font-weight: 800; }
.hotel-en { font-size: 14px; color: var(--teal-dark); font-weight: 700; }
.hotel-addr { font-size: 13.5px; margin-top: 6px; }
.hotel-addr.placeholder { color: var(--red); font-weight: 700; }
.hotel-notes { margin: 8px 0 0; padding: 0; list-style: none; font-size: 13px; }
.hotel-notes li { padding-left: 1.1em; position: relative; }
.hotel-notes li::before { content: "•"; position: absolute; left: 0; color: var(--gold); font-weight: 800; }
.btn-row { display: flex; gap: 8px; margin-top: 12px; }
.btn {
  border: 0; border-radius: 14px; padding: 12px 14px; font-weight: 800; font-size: 15px; cursor: pointer;
  background: var(--teal); color: #fff; box-shadow: 0 3px 0 var(--teal-dark); flex: 1;
  text-decoration: none; text-align: center; display: inline-block;
}
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--teal-dark); }
.btn.gold { background: var(--gold); color: #3A2A00; box-shadow: 0 3px 0 var(--gold-dark); }
.btn.ghost { background: var(--teal-light); color: var(--teal-dark); box-shadow: 0 3px 0 var(--teal-mid); }
.btn.small { flex: 0 0 auto; padding: 6px 12px; font-size: 13px; border-radius: 10px; }

/* 運転手用 全画面 */
#driver {
  position: fixed; inset: 0; z-index: 100; background: #fff; display: none;
  flex-direction: column; justify-content: center; padding: calc(env(safe-area-inset-top) + 24px) 22px calc(env(safe-area-inset-bottom) + 24px);
  text-align: center;
}
#driver.show { display: flex; }
#driver .d-label { font-size: 15px; color: var(--sub); font-weight: 700; }
#driver .d-name { font-size: 40px; font-weight: 900; line-height: 1.2; margin: 8px 0 6px; word-break: break-word; }
#driver .d-local { font-size: 30px; font-weight: 800; color: var(--teal-dark); line-height: 1.3; margin-bottom: 18px; }
#driver .d-addr { font-size: 28px; font-weight: 700; line-height: 1.4; background: var(--gold-light); border-radius: 18px; padding: 16px; word-break: break-word; }
#driver .d-addr.placeholder { color: var(--red); }
#driver .d-addr-sub { font-size: 20px; margin-top: 10px; color: var(--sub); }
#driver .d-close { position: absolute; top: calc(env(safe-area-inset-top) + 12px); right: 14px; width: 48px; height: 48px; border-radius: 50%; border: 0; background: var(--teal-light); font-size: 22px; color: var(--teal-dark); }
#driver .d-hint { position: absolute; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom) + 14px); font-size: 12px; color: var(--sub); }

/* やること */
.progress { padding: 14px 16px; }
.progress-top { display: flex; justify-content: space-between; align-items: baseline; font-weight: 800; }
.progress-top b { color: var(--teal); font-size: 24px; }
.bar { height: 12px; background: var(--teal-light); border-radius: 999px; overflow: hidden; margin-top: 8px; }
.bar-fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--teal), var(--gold)); border-radius: 999px; transition: width .3s; }
.todo { display: flex; align-items: flex-start; gap: 12px; padding: 14px; cursor: pointer; user-select: none; -webkit-user-select: none; }
.todo .box {
  flex: 0 0 28px; height: 28px; border-radius: 9px; border: 3px solid var(--teal-mid); background: #fff;
  display: grid; place-items: center; color: #fff; font-weight: 900; font-size: 16px; transition: all .15s;
}
.todo.done .box { background: var(--gold); border-color: var(--gold); }
.todo .t { font-size: 15px; font-weight: 700; }
.todo .n { font-size: 12px; color: var(--sub); margin-top: 2px; }
.todo.done .t { text-decoration: line-through; color: var(--sub); }

/* メモ */
.memo { padding: 14px 16px; }
.memo label { display: block; font-weight: 800; font-size: 14px; color: var(--teal-dark); margin-bottom: 6px; }
.memo .hint { font-size: 12px; color: var(--sub); margin-top: 4px; }
.field { display: flex; gap: 8px; }
.memo input, .memo textarea {
  width: 100%; font: inherit; font-size: 18px; padding: 10px 12px; border: 2px solid var(--line);
  border-radius: 12px; background: #FBFEFD; color: var(--ink); -webkit-appearance: none; appearance: none;
}
.memo input { font-weight: 700; letter-spacing: .04em; }
.memo textarea { min-height: 180px; resize: vertical; font-size: 16px; line-height: 1.6; }
.memo input:focus, .memo textarea:focus { outline: none; border-color: var(--teal); background: #fff; }
.saved { font-size: 12px; color: var(--teal); font-weight: 700; text-align: right; min-height: 18px; margin-top: 4px; }
.privacy { font-size: 12.5px; color: var(--sub); background: var(--teal-light); border-radius: 12px; padding: 10px 12px; margin-bottom: 12px; }


/* 見どころ */
.city-tabs { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 10px; margin: 0 -2px; scrollbar-width: none; }
.city-tabs::-webkit-scrollbar { display: none; }
.city-tabs button { flex: 0 0 auto; border: 2px solid var(--teal-mid); background: #fff; color: var(--teal-dark); border-radius: 999px; padding: 6px 14px; font-weight: 800; font-size: 14px; cursor: pointer; }
.city-tabs button.active { background: var(--teal); border-color: var(--teal); color: #fff; }
.city-head { padding: 14px 16px; background: linear-gradient(135deg, var(--teal-light), #fff); border: 2px solid var(--teal-mid); }
.city-head .cn { font-size: 20px; font-weight: 900; color: var(--teal-dark); }
.city-head .cd { font-size: 13px; margin-top: 2px; }
.city-head .ct { font-size: 13px; color: var(--sub); margin-top: 6px; }
.sight-photo { position: relative; aspect-ratio: 16 / 10; background: linear-gradient(135deg, var(--teal-mid), var(--gold-light)); display: grid; place-items: center; font-size: 48px; overflow: hidden; }
.sight-photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.sight-photo .credit { position: absolute; right: 0; bottom: 0; font-size: 9.5px; color: #fff; background: rgba(0,0,0,.45); padding: 2px 6px; border-top-left-radius: 8px; text-decoration: none; max-width: 80%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sight-photo .when { position: absolute; left: 10px; top: 10px; }
.sight-body { padding: 12px 14px 14px; }
.sight-top { display: flex; align-items: flex-start; gap: 8px; }
.sight-name { font-size: 18px; font-weight: 900; line-height: 1.3; }
.sight-en { font-size: 12.5px; color: var(--teal-dark); font-weight: 700; }
.star { margin-left: auto; flex: 0 0 auto; border: 2px solid var(--gold); background: #fff; color: var(--gold-dark); border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 800; cursor: pointer; white-space: nowrap; }
.star.on { background: var(--gold); color: #3A2A00; }
.sight-desc { font-size: 14.5px; margin-top: 6px; }
.sight-tip { font-size: 13px; background: var(--gold-light); border-radius: 10px; padding: 7px 10px; margin-top: 8px; }
.sight-tip::before { content: "💡 "; }
.sight-foot { display: flex; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.sight-foot .pill { font-size: 11px; }
.sight-foot a { margin-left: auto; }
.photo-note { font-size: 11.5px; color: var(--sub); text-align: center; margin: 14px 8px 0; }

/* 下部タブ */
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: rgba(255,255,255,.96); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(6, 1fr);
  padding-bottom: env(safe-area-inset-bottom);
  box-shadow: 0 -4px 16px rgba(29,43,42,.06);
}
nav.tabs button {
  height: var(--tabh); border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px; font-size: 10.5px; font-weight: 700; color: var(--sub); white-space: nowrap; cursor: pointer; position: relative;
}
nav.tabs button .ic { font-size: 22px; line-height: 1; filter: grayscale(.7); opacity: .8; transition: transform .15s; }
nav.tabs button.active { color: var(--teal-dark); }
nav.tabs button.active .ic { filter: none; opacity: 1; transform: translateY(-2px) scale(1.12); }
nav.tabs button.active::after { content: ""; position: absolute; top: 6px; width: 40px; height: 32px; border-radius: 12px; background: var(--teal-light); z-index: -1; }
nav.tabs .dot { position: absolute; top: 8px; right: calc(50% - 20px); width: 9px; height: 9px; border-radius: 50%; background: var(--red); border: 2px solid #fff; }

.toast {
  position: fixed; left: 50%; bottom: calc(var(--tabh) + env(safe-area-inset-bottom) + 16px); transform: translateX(-50%) translateY(20px);
  background: var(--ink); color: #fff; padding: 8px 16px; border-radius: 999px; font-size: 13px; font-weight: 700;
  opacity: 0; pointer-events: none; transition: all .2s; z-index: 50;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.foot { text-align: center; font-size: 11px; color: var(--sub); margin-top: 18px; }
</style>
</head>
<body>

<header class="top">
  <div class="top-title"><span>🕌 ウズベキスタン旅のしおり</span><button class="tz-btn" id="tzBtn" type="button">🕒 時差</button></div>
  <div class="countdown" id="countdown"></div>
  <div class="top-sub" id="topSub"></div>
  <div class="tz-note" id="tzNote"></div>
</header>

<main>
  <section class="view" id="view-days"></section>
  <section class="view" id="view-moves"></section>
  <section class="view" id="view-hotels"></section>
  <section class="view" id="view-sights"></section>
  <section class="view" id="view-todo"></section>
  <section class="view" id="view-memo"></section>
</main>

<nav class="tabs" id="tabs">
  <button type="button" data-tab="days"><span class="ic">📅</span>日程</button>
  <button type="button" data-tab="moves"><span class="ic">✈️</span>移動</button>
  <button type="button" data-tab="hotels"><span class="ic">🏨</span>宿</button>
  <button type="button" data-tab="sights"><span class="ic">📸</span>見どころ</button>
  <button type="button" data-tab="todo"><span class="ic">✅</span>やること</button>
  <button type="button" data-tab="memo"><span class="ic">📝</span>メモ</button>
</nav>

<div id="driver" role="dialog" aria-modal="true">
  <button class="d-close" type="button" id="driverClose" aria-label="閉じる">✕</button>
  <div class="d-label">Please take me to / Iltimos, shu manzilga</div>
  <div class="d-name" id="dName"></div>
  <div class="d-local" id="dLocal"></div>
  <div class="d-addr" id="dAddr"></div>
  <div class="d-hint">画面をタップすると閉じます</div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   データ（ここを書き換えれば内容が変わります）
   ・時刻はすべて現地時間
   ・個人情報（予約番号・マイレージ番号・乗車券番号）はここに書かない！
     → アプリの「メモ」タブで入力（端末の localStorage にだけ保存）
   ===================================================================== */

const TRIP = {
  title: 'ウズベキスタン旅行',
  start: '2026-12-27',
  end: '2027-01-03',
};

// 時差の注記
const TIMEZONES = [
  { place: '日本', utc: '+9' },

];

// 宿（id は日程の stay から参照）
const HOTELS = [
  {
    id: 'autoongo',
    name: '上海盎格ホテル',

  },
  {
    id: 'marhaba',

    nameLocal: '',
    city: 'タシケント（チランザール地区）',
    nights: ['2026-12-28', '2027-01-01'],
    address: '',          // 住所を記入
    addressLocal: '',     // 現地語の住所を記入
    notes: ['チランザール地区'],
  },
  {
    id: 'munis',
    name: 'ムニス ブティック ホテル',
    nameEn: 'Munis Boutique Hotel',
    nameLocal: '',
    city: 'ブハラ',
    nights: ['2026-12-29'],
    address: '',
    addressLocal: '',
    notes: [],
  },
  {
    id: 'movenpick',
    name: 'モーベンピック サマルカンド',
    nameEn: 'Mövenpick Samarkand',
    nameLocal: '',
    city: 'サマルカンド',
    nights: ['2026-12-30', '2026-12-31'],
    address: '',
    addressLocal: '',
    notes: ['2連泊'],
  },
];

// 日程（type: flight / train / move / sight / info、warn: true で赤い警告）
const DAYS = [
  {
    date: '2026-12-27', title: '名古屋 → 上海', area: '上海', tz: 'UTC+9 → +8', stay: 'autoongo',
    items: [

const LS_PREFIX = 'uzbtrip:';
function lsGet(key, fallback) {
  try { const v = localStorage.getItem(LS_PREFIX + key); return v === null ? fallback : v; }
  catch (e) { return fallback; }
}
function lsSet(key, value) {
  try { localStorage.setItem(LS_PREFIX + key, value); return true; }
  catch (e) { return false; }
}

const DOW = ['日', '月', '火', '水', '木', '金', '土'];
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function parseDate(str) { const [y, m, d] = str.split('-').map(Number); return new Date(y, m - 1, d); }
function ymd(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
function md(str) { const d = parseDate(str); return `${d.getMonth() + 1}/${d.getDate()}`; }
function dow(str) { return DOW[parseDate(str).getDay()]; }
function dayDiff(a, b) { return Math.round((parseDate(b) - parseDate(a)) / 86400000); }

// 端末の現地日付を「今日」とする（?date=2026-12-30 でテスト可能）
function todayStr() {
  try {
    const q = new URLSearchParams(location.search).get('date');
    if (q && /^\d{4}-\d{2}-\d{2}$/.test(q)) return q;
  } catch (e) {}
  return ymd(new Date());
}
const TODAY = todayStr();
const hotelById = (id) => HOTELS.find((h) => h.id === id);

/* ---------- ヘッダー ---------- */
function renderHeader() {
  const total = dayDiff(TRIP.start, TRIP.end) + 1;
  const toStart = dayDiff(TODAY, TRIP.start);
  const fromStart = dayDiff(TRIP.start, TODAY);
  const cd = $('#countdown'), sub = $('#topSub');
  if (toStart > 0) {
    cd.innerHTML = `出発まであと<b>${toStart}</b>日`;
    sub.textContent = `${md(TRIP.start)}(${dow(TRIP.start)}) 〜 ${md(TRIP.end)}(${dow(TRIP.end)})・${total}日間`;
  } else if (fromStart < total) {
    const day = DAYS.find((d) => d.date === TODAY);
    cd.innerHTML = `旅行<b>${fromStart + 1}</b>日目<span style="font-size:15px;opacity:.85"> / ${total}日</span>`;
    sub.textContent = day ? `今日：${day.title}` : '';
  } else {
    cd.innerHTML = 'おかえりなさい 🎉';
    sub.textContent = `${md(TRIP.start)} 〜 ${md(TRIP.end)} の旅、おつかれさまでした`;
  }
  $('#tzNote').innerHTML = '🕒 時刻はすべて現地時間<br>' + TIMEZONES.map((t) => `${esc(t.place)} UTC${esc(t.utc)}`).join('／') +
    '<br><span style="opacity:.85">日本との時差：上海 −1時間／タシケント −4時間</span>';
}
$('#tzBtn').addEventListener('click', () => $('#tzNote').classList.toggle('show'));

/* ---------- 日程 ---------- */
function renderDays() {
  const v = $('#view-days');
  const inTrip = TODAY >= TRIP.start && TODAY <= TRIP.end;
  const warnCount = DAYS.reduce((n, d) => n + d.items.filter((i) => i.warn).length, 0);
  let html = '';
  if (warnCount) {
    html += `<div class="warn-box" style="margin-bottom:12px">未手配の項目が ${warnCount} 件あります</div>`;
  }
  html += DAYS.map((d, idx) => {
    const isToday = d.date === TODAY;
    const isPast = d.date < TODAY;
    const hasWarn = d.items.some((i) => i.warn);
    const open = isToday || (!inTrip && TODAY < TRIP.start && idx === 0);
    const dw = parseDate(d.date).getDay();
    const hotel = d.stay ? hotelById(d.stay) : null;
    const cls = ['card', isToday && 'today', isPast && 'past', open && 'open', hasWarn && 'has-warn'].filter(Boolean).join(' ');
    const items = d.items.map((i) => `
      <li class="${esc(i.type)}${i.warn ? ' warn' : ''}">
        ${i.time ? `<span class="tl-time">${esc(i.time)}</span>` : ''}<span class="tl-text">${esc(i.text)}</span>
        ${i.note ? `<div class="tl-note">${esc(i.note)}</div>` : ''}
        ${i.warn ? `<div class="warn-box">${esc(i.warn)}</div>` : ''}
      </li>`).join('');
    const stay = hotel
      ? `<div class="stay-row">🛏️ <span><b>${esc(hotel.name)}</b> 泊</span><button class="btn small gold" type="button" data-driver="${esc(hotel.id)}">運転手に見せる</button></div>`
      : `<div class="stay-row">✈️ <span>${esc(d.stayLabel || '')}</span></div>`;
    return `
      <div class="${cls}" id="day-${d.date}">
        <button class="day-head" type="button" data-toggle>
          <div class="day-date ${dw === 0 ? 'sun' : dw === 6 ? 'sat' : ''}"><span class="md">${md(d.date)}</span><span class="dow">${DOW[dw]}</span></div>
          <div class="day-main">
            <div class="day-title">${esc(d.title)}</div>
            <div class="day-meta">
              ${isToday ? '<span class="pill today-badge">今日</span>' : ''}
              ${hasWarn ? '<span class="pill red">未手配あり</span>' : ''}
              <span class="pill">${esc(d.area)}</span><span class="pill gray">${esc(d.tz)}</span>
            </div>
          </div>
          <span class="chev">▼</span>
        </button>
        <div class="day-body"><ul class="timeline">${items}</ul>${stay}</div>
      </div>`;
  }).join('');
  html += '<div class="foot">時刻はすべて現地時間（日本UTC+9／上海UTC+8／タシケントUTC+5）</div>';
  v.innerHTML = html;
}
$('#view-days').addEventListener('click', (e) => {
  const t = e.target.closest('[data-toggle]');
  if (t) t.parentElement.classList.toggle('open');
});

let currentCity = lsGet('city', SIGHTS[0].city);
function renderSights() {
  const v = $('#view-sights');
  if (!SIGHTS.some((c) => c.city === currentCity)) currentCity = SIGHTS[0].city;
  const c = SIGHTS.find((x) => x.city === currentCity);
  const tabs = `<div class="city-tabs">${SIGHTS.map((x) => `<button type="button" data-city="${esc(x.city)}" class="${x.city === currentCity ? 'active' : ''}">${x.icon} ${esc(x.city)}</button>`).join('')}</div>`;
  const head = `<div class="card city-head"><div class="cn">${c.icon} ${esc(c.city)} <span style="font-size:13px;color:var(--sub);font-weight:700">${esc(c.cityEn)}</span></div>
    <div class="cd"><span class="pill gold">滞在 ${esc(c.when)}</span></div>${c.tip ? `<div class="ct">${esc(c.tip)}</div>` : ''}</div>`;
  const cards = c.spots.map((s) => {
    const on = lsGet('want:' + s.id, '0') === '1';
    const mapQ = encodeURIComponent(`${s.en.split('/')[0].trim()} ${c.cityEn}`);
    return `<div class="card">
      <div class="sight-photo">${s.icon || '📍'}
        ${s.photo ? `<img src="${esc(s.photo)}" alt="${esc(s.name)}" loading="lazy" crossorigin="anonymous" onerror="this.remove()">
        <a class="credit" href="${esc(s.source)}" target="_blank" rel="noopener">📷 ${esc(s.credit)}</a>` : ''}
        ${s.tag ? `<span class="pill gold when">${esc(s.tag)}</span>` : ''}
      </div>
      <div class="sight-body">
        <div class="sight-top"><div><div class="sight-name">${esc(s.name)}</div><div class="sight-en">${esc(s.en)}</div></div>
          <button type="button" class="star ${on ? 'on' : ''}" data-want="${esc(s.id)}">${on ? '★ 行きたい' : '☆ 行きたい'}</button></div>
        <div class="sight-desc">${esc(s.desc)}</div>
        ${s.tip ? `<div class="sight-tip">${esc(s.tip)}</div>` : ''}
        <div class="sight-foot"><a class="btn ghost small" href="https://www.google.com/maps/search/?api=1&query=${mapQ}" target="_blank" rel="noopener">📍 地図</a></div>
      </div>
    </div>`;
  }).join('');
  const wantN = SIGHTS.reduce((n, x) => n + x.spots.filter((s) => lsGet('want:' + s.id, '0') === '1').length, 0);
  v.innerHTML = tabs + head + cards +
    `<div class="photo-note">★ 行きたい：全都市で ${wantN} か所<br>写真：Wikimedia Commons（各写真右下に撮影者／ライセンス）<br>写真は電波のあるときに一度読み込むと、オフラインでも表示されます</div>`;
}
$('#view-sights').addEventListener('click', (e) => {
  const cb = e.target.closest('[data-city]');
  if (cb) {
    currentCity = cb.dataset.city; lsSet('city', currentCity); renderSights();
    const y = $('#view-sights').getBoundingClientRect().top + window.scrollY - $('header.top').offsetHeight - 8;
    if (window.scrollY > y) window.scrollTo(0, Math.max(0, y));
    return;
  }
  const w = e.target.closest('[data-want]');
  if (w) {
    const key = 'want:' + w.dataset.want;
    lsSet(key, lsGet(key, '0') === '1' ? '0' : '1');
    renderSights();
  }
});
// 写真を前もって端末に保存（電波のあるうちに。Service Worker がキャッシュする）
function precachePhotos() {
  if (!navigator.onLine || !('serviceWorker' in navigator)) return;
  navigator.serviceWorker.ready.then(() => {
    const urls = SIGHTS.flatMap((c) => c.spots.map((s) => s.photo).filter(Boolean));
    let i = 0;
    const next = () => {
      if (i >= urls.length) return;
      fetch(urls[i++], { mode: 'cors', credentials: 'omit' }).catch(() => {}).finally(() => setTimeout(next, 200));
    };
    next();
  }).catch(() => {});
}

function showDriver(id) {
  const h = hotelById(id);
  if (!h) return;
  $('#dName').textContent = h.nameEn;
  $('#dLocal').textContent = h.nameLocal || '';
  $('#dLocal').style.display = h.nameLocal ? '' : 'none';
  const a = $('#dAddr');
  if (h.addressLocal || h.address) {
    a.classList.remove('placeholder');
    a.innerHTML = esc(h.addressLocal || h.address) +
      (h.addressLocal && h.address && h.addressLocal !== h.address ? `<div class="d-addr-sub">${esc(h.address)}</div>` : '');
  } else {
    a.classList.add('placeholder');
    a.innerHTML = '住所を記入<div class="d-addr-sub">' + esc(h.city) + '</div>';
  }
  $('#driver').classList.add('show');
}
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-driver]');
  if (b) { e.stopPropagation(); showDriver(b.dataset.driver); }
});
$('#driver').addEventListener('click', () => $('#driver').classList.remove('show'));

function renderTodo() {
  const v = $('#view-todo');
  const done = TODOS.filter((t) => lsGet('todo:' + t.id, '0') === '1').length;
  const pct = TODOS.length ? Math.round((done / TODOS.length) * 100) : 0;
  v.innerHTML = `
    <div class="card progress">
      <div class="progress-top"><span>準備の進み具合</span><span><b>${done}</b> / ${TODOS.length}</span></div>
      <div class="bar"><div class="bar-fill" style="width:${pct}%"></div></div>
    </div>` +
    TODOS.map((t) => {
      const isDone = lsGet('todo:' + t.id, '0') === '1';
      return `<div class="card todo ${isDone ? 'done' : ''}" data-todo="${esc(t.id)}" role="checkbox" aria-checked="${isDone}">
        <div class="box">${isDone ? '✓' : ''}</div>
        <div><div class="t">${esc(t.text)}</div>${t.note ? `<div class="n">${esc(t.note)}</div>` : ''}</div>
      </div>`;
    }).join('');
  updateTodoDot();
}
function updateTodoDot() {
  const remaining = TODOS.filter((t) => lsGet('todo:' + t.id, '0') !== '1').length;
  const btn = $('#tabs [data-tab="todo"]');
  let dot = btn.querySelector('.dot');
  if (remaining && !dot) { dot = document.createElement('span'); dot.className = 'dot'; btn.appendChild(dot); }
  if (!remaining && dot) dot.remove();
}
$('#view-todo').addEventListener('click', (e) => {
  const el = e.target.closest('[data-todo]');
  if (!el) return;
  const key = 'todo:' + el.dataset.todo;
  const next = lsGet(key, '0') === '1' ? '0' : '1';
  if (!lsSet(key, next)) toast('保存できませんでした（プライベートモード？）');
  renderTodo();
});

    MEMO_FIELDS.map((f) => `
    <div class="card memo">
      <label for="memo-${f.id}">${esc(f.label)}</label>
      ${f.type === 'textarea'
        ? `<textarea id="memo-${f.id}" data-memo="${f.id}" placeholder="自由にメモ"></textarea>`
        : `<div class="field"><input id="memo-${f.id}" data-memo="${f.id}" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" ${f.mode === 'numeric' ? 'inputmode="numeric"' : ''} placeholder="未入力"><button class="btn small ghost" type="button" data-copy="${f.id}">コピー</button></div>`}
      ${f.hint ? `<div class="hint">${esc(f.hint)}</div>` : ''}
      <div class="saved" id="saved-${f.id}"></div>
    </div>`).join('');
  MEMO_FIELDS.forEach((f) => { $(`#memo-${f.id}`).value = lsGet('memo:' + f.id, ''); });
}
const saveTimers = {};
$('#view-memo').addEventListener('input', (e) => {
  const id = e.target.dataset.memo;
  if (!id) return;
  const ok = lsSet('memo:' + id, e.target.value);
  const s = $(`#saved-${id}`);
  s.textContent = ok ? '✓ 保存しました' : '⚠️ 保存できませんでした';
  s.style.color = ok ? '' : 'var(--red)';
  clearTimeout(saveTimers[id]);
  saveTimers[id] = setTimeout(() => { s.textContent = ''; }, 1500);
});
$('#view-memo').addEventListener('click', async (e) => {
  const b = e.target.closest('[data-copy]');
  if (!b) return;
  const input = $(`#memo-${b.dataset.copy}`);
  if (!input.value) { toast('未入力です'); return; }
  try { await navigator.clipboard.writeText(input.value); toast('コピーしました'); }
  catch (err) { input.select(); try { document.execCommand('copy'); toast('コピーしました'); } catch (e2) { toast('コピーできませんでした'); } }
});

/* ---------- 共通 ---------- */
let toastTimer;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1600);
}

function showTab(name, scroll = true) {
  document.querySelectorAll('section.view').forEach((s) => s.classList.toggle('active', s.id === 'view-' + name));
  document.querySelectorAll('#tabs button').forEach((b) => b.classList.toggle('active', b.dataset.tab === name));
  lsSet('tab', name);
  if (scroll) window.scrollTo(0, 0);
}
$('#tabs').addEventListener('click', (e) => {
  const b = e.target.closest('[data-tab]');
  if (b) showTab(b.dataset.tab);
});

function init() {
  renderHeader();
  renderDays();
  renderMoves();
  renderHotels();
  renderSights();
  renderTodo();
  renderMemo();
  const inTrip = TODAY >= TRIP.start && TODAY <= TRIP.end;
  // 旅行中は必ず日程タブを開いて当日のカードへスクロール
  const saved = lsGet('tab', 'days');
  const tab = inTrip ? 'days' : (['days', 'moves', 'hotels', 'sights', 'todo', 'memo'].includes(saved) ? saved : 'days');
  showTab(tab, false);
  if (inTrip) {
    const el = document.getElementById('day-' + TODAY);
    if (el) setTimeout(() => {
      const y = el.getBoundingClientRect().top + window.scrollY - $('header.top').offsetHeight - 10;
      window.scrollTo({ top: Math.max(0, y), behavior: 'smooth' });
    }, 150);
  }
}
init();

// 日付が変わったら（開きっぱなしで翌日になった場合など）再読み込み
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && todayStr() !== TODAY) location.reload();
});

// オフライン対応
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').then(() => setTimeout(precachePhotos, 1500)).catch(() => {});
  });
}
</script>
